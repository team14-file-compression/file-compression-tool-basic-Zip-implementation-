# Builds the tool and runs the unit tests on every push and pull request,
# on Linux, Windows and macOS (also gives evidence for issue #9, portability).
name: Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Show compiler version
        run: g++ --version

      - name: Build huffzip
        run: g++ -std=c++17 -Wall -Wextra -O2 -Iinclude src/*.cpp -o huffzip

      - name: Build unit tests
        run: g++ -std=c++17 -Wall -Wextra -O2 -Iinclude $(ls src/*.cpp | grep -v main.cpp) tests/*.cpp -o run_tests

      - name: Run unit tests
        run: ./run_tests

      - name: Smoke test the CLI
        run: |
          ./huffzip -h
          if ./huffzip -c no_such_file.txt; then echo "should have failed"; exit 1; fi
          echo "hello hello hello" > smoke.txt
          ./huffzip -c smoke.txt -o smoke.huff
          test -s smoke.huff
          if ./huffzip -c smoke.txt -o smoke.txt; then echo "should refuse to overwrite input"; exit 1; fi
